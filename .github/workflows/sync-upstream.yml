name: Sync Upstream
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.email "6313052@qq.com"
          git config user.name "hsl-001"

      - name: Sync upstream
        run: |
          git remote add upstream https://github.com/DHDAXCW/OpenWRT_x86_x64.git
          git fetch upstream
          git merge upstream/main --no-edit || {
            # 冲突时：采用上游版本，丢弃本地改动
            git checkout --theirs immortalwrt/x86_64/defconfig
            git add immortalwrt/x86_64/defconfig
            git commit --no-edit
          }
          git push
